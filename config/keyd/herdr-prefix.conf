# Omarchy/Linux: make Caps Lock emit Herdr's Ctrl+Space prefix.
# Installed explicitly to /etc/keyd/herdr-prefix.conf; this is not a Stow file.
#
# This replaces Omarchy's Caps Lock compose sequences. Omarchy's existing
# both-Shift-keys shortcut remains available for toggling Caps Lock.

[ids]
*

[main]
capslock = C-space
