# MX Vertical (Bluetooth): upper thumb-rest button (Forward) -> Enter.
# Same reasoning as mx-ergo-s.conf: no HID++ button events over Bluetooth,
# so remap at evdev with keyd. Matched by id so only this mouse is affected.
# Buttons 4/5 arrive as BTN_SIDE/BTN_EXTRA = keyd mouse1/mouse2; the upper
# thumb button is Forward = mouse2. Lower (Back, mouse1) left untouched.
[ids]
m:046d:b020

[main]
mouse2 = enter
