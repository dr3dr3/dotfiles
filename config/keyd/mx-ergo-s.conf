# MX Ergo S (Bluetooth): front small button beside left-click (Forward) -> Enter.
# Done in keyd because the Ergo S sends no HID++ button events over
# Bluetooth, so Solaar/logiops diversion cannot see the press.
# Matched by id with the m: prefix so only this mouse is affected.
#
# Linux reports HID mouse buttons 4/5 as BTN_SIDE/BTN_EXTRA, which keyd
# names mouse1/mouse2 (its mouseback/mouseforward are BTN_BACK/BTN_FORWARD,
# which this mouse never sends). mouse2 = the front button.
[ids]
m:046d:b03e

[main]
mouse2 = enter
